[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aioescea"
dynamic = ["version"]
description = "Async local-network client for Escea gas fireplaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Maller" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
keywords = ["escea", "fireplace", "home-assistant", "asyncio", "udp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/olliemaller/aioescea"
Issues = "https://github.com/olliemaller/aioescea/issues"
Changelog = "https://github.com/olliemaller/aioescea/blob/main/CHANGELOG.md"

[project.scripts]
aioescea = "aioescea.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
lint = ["ruff>=0.8", "mypy>=1.13"]

[tool.hatch.version]
path = "src/aioescea/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aioescea"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "S104", "ASYNC109"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["aioescea"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S324"]
